<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="brazaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- TV Icon with Flame / Signal Waves -->
  <g transform="translate(10, 15)">
    <!-- Screen Frame -->
    <rect x="0" y="8" width="65" height="52" rx="10" fill="#1e293b" stroke="url(#brazaGrad)" stroke-width="3" />
    <!-- Antennas -->
    <line x1="20" y1="8" x2="8" y2="-4" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="8" x2="57" y2="-4" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Flame / Signal Inside Screen -->
    <path d="M 32 18 C 30 25 24 28 24 36 C 24 44 30 48 36 48 C 42 48 45 44 45 38 C 45 30 38 27 38 24 C 36 28 34 30 32 30 C 31 28 31 23 32 18 Z" fill="url(#brazaGrad)" filter="url(#glow)" />
    <!-- Mini Live Dot -->
    <circle cx="56" cy="18" r="3" fill="#ef4444" />
  </g>

  <!-- Brand Typography -->
  <text x="90" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#ffffff">
    TV <tspan fill="url(#brazaGrad)">BRAZA</tspan>
  </text>
  
  <rect x="315" y="32" width="72" height="24" rx="6" fill="#ef4444" />
  <circle cx="327" cy="44" r="4" fill="#ffffff" />
  <text x="337" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE 24H</text>

  <text x="92" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="4">
    STUDIO PLAYOUT SYSTEM
  </text>
</svg>
